  <g id="text_33">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #6c7774" transform="translate(71.28 437.33025)">The proposed model uses one following epoch. Remaining epochs exclude exact boundaries; stable means distance ≥ five minutes.</text>
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #6c7774" transform="translate(71.28 447.408281)">Groups overlap and are not additive. Similar point estimates do not demonstrate statistical noninferiority.</text>
