[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "boas-phase-transition-predictor"
version = "1.0.0"
description = "Physiology-informed sleep-stage correction and boundary prediction using open BOAS recordings"
requires-python = ">=3.12"
authors = [{name = "Miguel Omar Belhouk Herrero"}]
dependencies = [
  "numpy==2.3.5",
  "scipy==1.17.0",
  "pandas==2.2.3",
  "scikit-learn==1.8.0",
  "joblib==1.5.3",
  "matplotlib>=3.8,<4",
]

[project.optional-dependencies]
notebook = ["nbformat>=5.10,<6", "nbclient>=0.10,<1", "ipykernel>=6,<8"]
dev = ["pytest>=8,<10", "ruff>=0.12"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
